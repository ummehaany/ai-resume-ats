[theme]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"
font = "sans serif"

[server]
# Matches the backend's 5 MB resume limit. (XSRF protection and CORS are left at
# Streamlit's secure defaults - do not disable them.)
maxUploadSize = 5
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "minimal"
